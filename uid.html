<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UID Info Fetcher</title>
    

       <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #results { margin-top: 20px; }
        textarea { width: 100%; margin-bottom: 10px; font-size: 16px; }
        .live, .dead { padding: 10px; margin-top: 10px; border-radius: 5px; }
        .live { background-color: #d4edda; color: #155724; }
        .dead { background-color: #f8d7da; color: #721c24; }
        button { padding: 10px 15px; background: #28a745; color: #fff; border: none; cursor: pointer; margin-right: 5px; }
        button:hover { background: #218838; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Facebook UID Checker</h1>

    <textarea id="uidInput" placeholder="Nhập danh sách UID..." rows="5"></textarea>
   <input type="file" id="fileInput" accept=".txt" onchange="loadFile()">
    <button onclick="checkUIDs()">Check UIDs</button>
    <button onclick="copyLiveUIDs()" class="hidden" id="copyButton">Copy Live UIDs</button>

    <div id="results">
        <h2>Kết quả:</h2>

        <div class="live">
            <strong>✅ Live UIDs (<span id="countLive">0</span>):</strong>
            <textarea id="ListLive" rows="5" readonly></textarea>
        </div>

        <div class="dead">
            <strong>❌ Dead UIDs (<span id="countDead">0</span>):</strong>
            <textarea id="ListDead" rows="5" readonly></textarea>
        </div>


    <script>
        // Tự động tải lên và đọc file TXT
        function loadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Vui lòng chọn một file TXT.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('uidInput').value = event.target.result;
            };
            reader.readAsText(file);
        }

        // Kiểm tra danh sách UID
        async function checkUIDs() {
            let uidData = document.getElementById('uidInput').value.trim().split('\n').map(line => line.trim()).filter(line => line);
            let liveCount = 0, deadCount = 0;

            document.getElementById('ListLive').value = '';
            document.getElementById('ListDead').textContent = '';
            document.getElementById('countLive').textContent = '0';
            document.getElementById('countDead').textContent = '0';

            const requests = uidData.map(async (line) => {
                let parts = line.split('|');
                let uid = parts[0];  // Lấy UID từ chuỗi gốc

                try {
                    let response = await fetch(`https://graph.facebook.com/${uid}/picture?type=normal`);
                    if (response.ok && !response.url.includes("//static")) {
                        document.getElementById('ListLive').value += line + "\n";  // Lưu UID gốc vào ô live
                        document.getElementById('countLive').textContent = ++liveCount;
                    } else {
                        document.getElementById('ListDead').textContent += line + "\n";  // Lưu UID gốc vào ô dead
                        document.getElementById('countDead').textContent = ++deadCount;
                    }
                } catch (error) {
                    console.error(`Lỗi kiểm tra UID ${uid}:`, error);
                    document.getElementById('ListDead').textContent += line + " (Lỗi kết nối)\n";  // Lỗi kết nối
                    document.getElementById('countDead').textContent = ++deadCount;
                }
            });

            await Promise.all(requests);
            alert("✅ Kiểm tra hoàn tất!");

            // Hiện nút Copy Live UIDs nếu có UID sống
            if (liveCount > 0) {
                document.getElementById('copyButton').classList.remove('hidden');
            } else {
                document.getElementById('copyButton').classList.add('hidden');
            }
        }

        // Sao chép Live UIDs vào clipboard
        function copyLiveUIDs() {
            let liveUIDs = document.getElementById('ListLive').value;
            if (!liveUIDs.trim()) {
                alert("Không có UID nào để sao chép.");
                return;
            }

            navigator.clipboard.writeText(liveUIDs).then(() => {
                alert("✅ Đã sao chép Live UIDs vào clipboard!");
            }).catch(err => {
                alert("❌ Lỗi khi sao chép: " + err);
            });
        }
    </script>
</body>
</html>
