<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lọc UID Facebook</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { background: #f0f2f5; }
    .container { margin-top: 30px; max-width: 800px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    textarea { resize: vertical; }
    .progress { height: 20px; }
    .box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 15px; }
    #loading { font-weight: bold; color: #ff5722; animation: pulse 1.2s infinite; display: none; }
    #clearBtn { display: none; }
    @keyframes pulse { 0% { opacity: .4; } 50% { opacity: 1; } 100% { opacity: .4; } }
  </style>
</head>
<body>
  <div class="text-container">
    <h2 class="text-center text-primary">LỌC UID FACEBOOK</h2>
    <textarea id="uidInput" rows="5" class="form-control" placeholder="Nhập danh sách UID.." oninput="toggleClearButton(); checkUIDs();"></textarea>
    <br>
    <div class="d-flex justify-content-between">
      <div class="form-group mb-0">
        <input type="file" id="fileInput" accept=".txt" hidden>
        <button class="btn btn-outline-primary" onclick="document.getElementById('fileInput').click()">📂 Chọn file</button>
      </div>
      <div>
        <select id="batchSize" class="form-control">
          <option value="300" selected>Speed 300</option>
          <option value="500">Speed 500</option>
          <option value="1000">Speed 1000</option>
        </select>
      </div>
      <div>
        <button class="btn btn-success" onclick="checkUIDs()">✅ Check UID</button> <br>
        <button class="btn btn-danger" id="clearBtn" onclick="clearAll()">🗑 Xoá All</button>
      </div>
    </div>
    <br>
    <div class="form-group">
      <label>Lọc dòng chứa một trong các từ:</label>
      <textarea id="map_have_text" class="form-control" rows="3" placeholder="Nhập từ cần chứa..."></textarea>
    </div>
    <div class="form-group">
      <label>Lọc dòng không chứa các từ:</label>
      <textarea id="map_havenot_text" class="form-control" rows="3" placeholder="Nhập từ cần loại..."></textarea>
    </div>
    <div class="form-group">
      <button class="btn btn-warning" onclick="mapText()">🔎 Lọc chuỗi nâng cao</button>
    </div>
    <div class="form-group">
      <textarea id="filteredOutput" class="form-control" rows="3" placeholder="Kết quả sau khi lọc..."></textarea>
    </div>
    <p id="loading">⏳ Đang xử lý...</p>
    <div class="progress mb-3">
      <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;">0%</div>
    </div>
    <div class="box">
      <h5>✅ UID Sống (<span id="countLive">0</span>)</h5>
      <textarea id="ListLive" class="form-control" rows="5" readonly></textarea>
      <button class="btn btn-outline-success mt-2" onclick="copyToClipboard('ListLive')">📋 Copy</button>
    </div>
    <div class="box">
      <h5>❌ UID Die (<span id="countDead">0</span>)</h5>
      <textarea id="ListDead" class="form-control" rows="5" readonly></textarea>
      <button class="btn btn-outline-danger mt-2" onclick="copyToClipboard('ListDead')">📋 Copy</button>
    </div>
  </div>
  <script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('uidInput').value += '\n' + e.target.result;
        toggleClearButton();
        checkUIDs();
      };
      reader.readAsText(file);
    });

    function toggleClearButton() {
      const input = document.getElementById("uidInput").value.trim();
      document.getElementById("clearBtn").style.display = input ? "inline-block" : "none";
    }

    function clearAll() {
      ['uidInput','ListLive','ListDead','filteredOutput'].forEach(id => document.getElementById(id).value = "");
      ['countLive','countDead'].forEach(id => document.getElementById(id).textContent = "0");
      updateProgress(0);
      toggleClearButton();
    }

    function updateProgress(val) {
      let bar = document.getElementById("progressBar");
      bar.style.width = val + "%";
      bar.textContent = Math.round(val) + "%";
    }

    async function checkUIDs() {
      let raw = document.getElementById("uidInput").value.split("\n").map(e => e.trim()).filter(e => e);
      let lines = [...new Set(raw)];
      let batchSize = parseInt(document.getElementById("batchSize").value);
      let live = [], dead = [], total = lines.length;
      let liveCount = 0, deadCount = 0;

      document.getElementById("loading").style.display = "block";

      for (let i = 0; i < total; i += batchSize) {
        let batch = lines.slice(i, i + batchSize);
        await Promise.all(batch.map(async (line) => {
          let parts = line.split('|');
          let uid = parts[0];

          if (live.includes(uid) || dead.includes(uid)) return;

          try {
            let res = await fetch(`https://graph.facebook.com/${uid}/picture?type=normal`);
            if (res.ok && !res.url.includes("/static")) {
              document.getElementById('ListLive').value += line + "\n";
              document.getElementById('countLive').textContent = ++liveCount;
              live.push(uid);
            } else {
              document.getElementById('ListDead').value += line + "\n";
              document.getElementById('countDead').textContent = ++deadCount;
              dead.push(uid);
            }
          } catch (error) {
            console.error(`Lỗi kiểm tra UID ${uid}:`, error);
            document.getElementById('ListDead').value += line + " (Lỗi kết nối)\n";
            document.getElementById('countDead').textContent = ++deadCount;
            dead.push(uid);
          }
        }));
        updateProgress((i + batch.length) / total * 100);
      }

      document.getElementById("loading").style.display = "none";
    }

    function copyToClipboard(id) {
      let textarea = document.getElementById(id);
      textarea.select();
      document.execCommand("copy");
      alert("Đã sao chép vào clipboard!");
    }

    function mapText() {
      const input = document.getElementById("uidInput").value.split("\n").map(e => e.trim()).filter(e => e);
      const includeWords = document.getElementById("map_have_text").value.split("\n").map(e => e.trim().toLowerCase()).filter(e => e);
      const excludeWords = document.getElementById("map_havenot_text").value.split("\n").map(e => e.trim().toLowerCase()).filter(e => e);

      let filtered = input.filter(line => {
        const lower = line.toLowerCase();
        const hasAny = includeWords.length ? includeWords.some(w => lower.includes(w)) : true;
        const hasNone = excludeWords.every(w => !lower.includes(w));
        return hasAny && hasNone;
      });

      filtered = [...new Set(filtered)];
      document.getElementById("filteredOutput").value = filtered.join("\n");
    }
  </script>
</body>
</html>
