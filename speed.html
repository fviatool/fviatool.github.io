<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpeedTest - Kiểm Tra Tốc Độ Mạng</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 30px;
      margin: 0;
      text-align: center;
    }
    .box {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { color: #007bff; margin-bottom: 20px; }
    .result { font-size: 20px; margin: 10px 0; color: #333; }
    .small { font-size: 14px; color: #777; }
    .progress-text { font-size: 16px; margin-top: 10px; color: #555; }
    button {
      padding: 10px 25px;
      font-size: 16px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover { background: #218838; }
  </style>
</head>
<body>

<div class="box">
  <h1>Kiểm Tra Tốc Độ Mạng</h1>
  <div class="result" id="ip">Đang xác định IP...</div>
  <div class="result" id="location">Vị trí: ...</div>
  <div class="result" id="download">Tải xuống: ...</div>
  <div class="progress-text" id="downloadProgress"></div>
  <div class="result" id="upload">Tải lên: ...</div>
  <div class="progress-text" id="uploadProgress"></div>
  <div class="result small" id="server">Máy chủ: ...</div>
  <button onclick="startTest()">Kiểm tra lại</button>
</div>

<script>
  const ipv4Servers = [
    { name: "Netflix Singapore", url: "https://ipv4-c090-sin001-ix.1.oca.nflxvideo.net/speedtest" },
    { name: "Netflix Hong Kong", url: "https://ipv4-c071-hkg001-ix.1.oca.nflxvideo.net/speedtest" },
    { name: "Netflix Japan", url: "https://ipv4-c144-tyo001-ix.1.oca.nflxvideo.net/speedtest" }
  ];
  const ipv6Servers = [
    { name: "Netflix Singapore IPv6", url: "https://ipv6-c074-sin001-ix.1.oca.nflxvideo.net/speedtest" },
    { name: "Netflix Hong Kong IPv6", url: "https://ipv6-c050-hkg001-ix.1.oca.nflxvideo.net/speedtest" },
    { name: "Netflix Japan IPv6", url: "https://ipv6-c132-tyo001-ix.1.oca.nflxvideo.net/speedtest" }
  ];
  const customServers = [
    { name: "Viettel Network - Đồng Nai", url: "http://speedtestkv3dp1.viettel.vn:8080/speedtest/upload.php" },
    { name: "VNPT HCM", url: "http://speedtest3.vtn.com.vn:8080/speedtest/upload.php" },
    { name: "Viettel IDC - HCM", url: "http://hht-speedtest.viettelidc.com.vn:8080/speedtest/upload.php" }
  ];

  function formatSpeed(mbps) {
    const mb = parseFloat(mbps);
    if (isNaN(mb)) return "0 MB/s";
    const gb = mb / 1024;
    return gb >= 1 ? `${mb.toFixed(2)} MB/s (${gb.toFixed(2)} GB/s)` : `${mb.toFixed(2)} MB/s`;
  }

  async function fetchIP() {
    const apis = [
      {
        url: "https://ipapi.co/json/",
        parse: d => ({ ip: d.ip, country: d.country_name, city: d.city, version: d.version || 4 })
      },
      {
        url: "https://ipwho.is/",
        parse: d => ({ ip: d.ip, country: d.country, city: d.city, version: d.ip?.includes(':') ? 6 : 4 })
      },
      {
        url: "https://ipinfo.io/json?token=demo",
        parse: d => ({ ip: d.ip, country: d.country, city: d.city, version: d.ip?.includes(':') ? 6 : 4 })
      }
    ];
    for (const api of apis) {
      try {
        const res = await fetch(api.url);
        const data = await res.json();
        if (data && !data.error) return api.parse(data);
      } catch {}
    }
    return { ip: "Không xác định", city: "?", country: "?", version: 4 };
  }

  async function measureSpeedRealTime(url, type) {
    const controller = new AbortController();
    const signal = controller.signal;
    const progressEl = document.getElementById(type + "Progress");

    return new Promise(async resolve => {
      let loaded = 0;
      const startTime = performance.now();
      try {
        const res = await fetch(url + '?r=' + Math.random(), { method: 'GET', cache: 'no-store', signal });
        const reader = res.body.getReader();
        const sizeMB = 5;
        const interval = setInterval(() => {
          const elapsed = (performance.now() - startTime) / 1000;
          const speed = loaded / elapsed / 1024 / 1024;
          progressEl.textContent = `Tốc độ thực: ${formatSpeed(speed)}`;
        }, 500);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          loaded += value.length;
        }
        clearInterval(interval);
        progressEl.textContent = "";
        const totalTime = (performance.now() - startTime) / 1000;
        const finalSpeed = (loaded / 1024 / 1024) / totalTime;
        resolve(finalSpeed.toFixed(2));
      } catch (e) {
        progressEl.textContent = "";
        resolve("0.00");
      }
    });
  }

  async function startTest() {
    document.getElementById('ip').textContent = "Đang xác định IP...";
    document.getElementById('location').textContent = "Vị trí: ...";
    document.getElementById('download').textContent = "Đang đo tốc độ tải xuống...";
    document.getElementById('upload').textContent = "Đang đo tốc độ tải lên...";
    document.getElementById('server').textContent = "Đang chọn máy chủ...";
    document.getElementById('downloadProgress').textContent = "";
    document.getElementById('uploadProgress').textContent = "";

    const info = await fetchIP();
    document.getElementById('ip').textContent = `IP: ${info.ip}`;
    document.getElementById('location').textContent = `Vị trí: ${info.city}, ${info.country}`;

    const allServers = [...customServers, ...(info.version === 6 ? ipv6Servers : ipv4Servers)];
    const server = allServers[Math.floor(Math.random() * allServers.length)];
    document.getElementById('server').textContent = `Máy chủ: ${server.name || 'Không rõ'}`;

    const download = await measureSpeedRealTime(server.url, "download");
    document.getElementById('download').textContent = `Tải xuống: ${formatSpeed(download)}`;

    const upload = await measureSpeedRealTime(server.url, "upload");
    document.getElementById('upload').textContent = `Tải lên: ${formatSpeed(upload)}`;
  }

  window.onload = startTest;
</script>

</body>
</html>
