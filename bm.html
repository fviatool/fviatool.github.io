<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lọc UID Facebook - BM Tool</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <style>
    body {
      background: #f0f2f5;
    }
    .container {
      margin-top: 30px;
      max-width: 900px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }
    textarea {
      resize: vertical;
    }
    .section {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .section textarea {
      height: 120px;
    }
    .label {
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="text-container">
    <h3 class="text-center text-primary">LỌC UID FACEBOOK THEO BM</h3>

    <textarea id="uidInput" rows="5" class="form-control mt-3" placeholder="Nhập danh sách UID..." oninput="autoFilterBM(); toggleClearButton();"></textarea>

    <div class="d-flex justify-content-between mt-3">
      <div>
        <input type="file" id="fileInput" accept=".txt" hidden />
        <button class="btn btn-outline-primary" onclick="document.getElementById('fileInput').click()">📂 Chọn file</button>
      </div>
      <div>
        <button class="btn btn-danger" id="clearBtn" onclick="clearAll()" style="display:none;">🗑 Xoá All</button>
   <br>
   <br>
   </div>
   </div>  
    <div class="text-center">
      <label><input type="checkbox" id="filterBM10" checked> BM10</label>
      <label class="ml-3"><input type="checkbox" id="filterBM5" checked> BM5</label>
      <label class="ml-3"><input type="checkbox" id="filterBM3" checked> BM3</label>

    <div class="mt-2">
      <p>BM10: <span id="count10">0</span> | BM5: <span id="count5">0</span> | BM3: <span id="count3">0</span></p>
    </div>

    <div class="text-center">
      <div class="label">Kết quả BM10:</div>
      <textarea id="bm10" rows="5" readonly class="form-control mb-2"></textarea>
      <button class="btn btn-outline-secondary" onclick="copyToClipboard('bm10')">📋 Copy BM10</button>
    </div>

    <div class="text-center">
      <div class="label">Kết quả BM5:</div>
      <textarea id="bm5" rows="5" readonly class="form-control mb-2"></textarea>
      <button class="btn btn-outline-secondary" onclick="copyToClipboard('bm5')">📋 Copy BM5</button>
    </div>

    <div class="text-center">
      <div class="label">Kết quả BM3:</div>
      <textarea id="bm3" rows="5" readonly class="form-control mb-2"></textarea>
      <button class="btn btn-outline-secondary" onclick="copyToClipboard('bm3')">📋 Copy BM3</button>
    </div>
  </div>

  <script>
    function toggleClearButton() {
      const val = document.getElementById("uidInput").value.trim();
      document.getElementById("clearBtn").style.display = val ? "inline-block" : "none";
    }

    function clearAll() {
      document.getElementById("uidInput").value = "";
      ['bm10', 'bm5', 'bm3'].forEach(id => document.getElementById(id).value = "");
      ['count10', 'count5', 'count3'].forEach(id => document.getElementById(id).textContent = "0");
      toggleClearButton();
    }

    function copyToClipboard(id) {
      const el = document.getElementById(id);
      el.select();
      document.execCommand("copy");
    }

    function autoFilterBM() {
      const lines = document.getElementById("uidInput").value.split('\n').map(e => e.trim()).filter(Boolean);
      const uniqueLines = [...new Set(lines)];

      const bm10Checked = document.getElementById("filterBM10").checked;
      const bm5Checked = document.getElementById("filterBM5").checked;
      const bm3Checked = document.getElementById("filterBM3").checked;

      const bm10 = [], bm5 = [], bm3 = [];

      uniqueLines.forEach(line => {
        if (line.includes("BM10") && bm10Checked) bm10.push(line);
        else if (line.includes("BM5") && bm5Checked) bm5.push(line);
        else if (line.includes("BM3") && bm3Checked) bm3.push(line);
      });

      document.getElementById("bm10").value = bm10.join("\n");
      document.getElementById("bm5").value = bm5.join("\n");
      document.getElementById("bm3").value = bm3.join("\n");

      document.getElementById("count10").textContent = bm10.length;
      document.getElementById("count5").textContent = bm5.length;
      document.getElementById("count3").textContent = bm3.length;
    }

    window.onload = function () {
      autoFilterBM();
    };
  </script>
</body>
</html>
