<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý Tài khoản theo Domain</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
    }
    h2 {
      margin-bottom: 15px;
    }
    input[type=file], input[type=text] {
      padding: 8px;
      margin-bottom: 15px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 20px;
      background: white;
      box-shadow: 0 0 8px rgb(0 0 0 / 0.05);
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background-color: #007BFF;
      color: white;
      user-select: none;
    }
    tr:hover {
      background-color: #f1f8ff;
      cursor: pointer;
    }
    .domain-count {
      font-weight: bold;
      color: #007BFF;
    }
    .btn-copy {
      background-color: #28a745;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      margin-left: 10px;
      transition: background-color 0.2s;
    }
    .btn-copy:hover {
      background-color: #218838;
    }
    #accountListBox {
      margin-top: 10px;
    }
    #downloadLink {
      display: none;
      padding: 10px 20px;
      background: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    #downloadLink:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Quản lý Tài khoản theo Domain</h2>

  <input type="file" id="fileInput" accept=".txt" multiple />
  <br />
  <input type="text" id="domainSearchInput" placeholder="🔍 Tìm domain (facebook, paypal, google...)" onkeyup="filterDomains()" />
  <br />

  <div id="domainListBox">
    <table id="domainTable" aria-label="Danh sách domain">
      <thead>
        <tr>
          <th>Domain</th>
          <th>Số tài khoản</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="accountListBox" style="display:none;">
    <h3>Danh sách tài khoản cho domain: <span id="selectedDomain"></span></h3>
    <table id="accountTable" aria-label="Danh sách tài khoản">
      <thead>
        <tr>
          <th>Email/Username</th>
          <th>Password</th>
          <th>Copy</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <a id="downloadLink" href="#" download="tatca_taikhoan.txt">📥 Tải file tất cả tài khoản</a>

  <script>
    // Data structure: domain => [{user, pass}, ...]
    const domainAccounts = new Map();
    let filteredDomains = [];
    
    // Helper: parse each file content
    function parseText(text) {
      // Các regex xử lý 2 định dạng input
      // Định dạng 1:
      // UR1: https://domain | U53RN4M3: username | P455W0RD: password
      // Định dạng 2:
      // Url: https://domain
      // Username: user
      // Password: pass
      
      const lines = text.split(/\r?\n/);
      const results = [];

      // Tạm lưu cho định dạng 2
      let tempUrl = "", tempUser = "", tempPass = "";
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        // Định dạng 1, 1 dòng chứa đủ info
        let match1 = line.match(/UR1:\s*(\S+).*?U53RN4M3:\s*([^|]+).*?P455W0RD:\s*(.*)$/i);
        if (match1) {
          results.push({
            url: match1[1].trim(),
            user: match1[2].trim(),
            pass: match1[3].trim()
          });
          continue;
        }

        // Định dạng 2: 3 dòng lần lượt Url, Username, Password
        if (line.toLowerCase().startsWith("url:")) {
          tempUrl = line.substring(4).trim();
          tempUser = ""; tempPass = "";
          // Tiếp tục check 2 dòng tiếp theo
          if (i + 2 < lines.length) {
            let uLine = lines[i + 1].trim();
            let pLine = lines[i + 2].trim();
            if (uLine.toLowerCase().startsWith("username:") && pLine.toLowerCase().startsWith("password:")) {
              tempUser = uLine.substring(9).trim();
              tempPass = pLine.substring(9).trim();
              results.push({ url: tempUrl, user: tempUser, pass: tempPass });
              i += 2; // nhảy 2 dòng
              continue;
            }
          }
        }
      }
      return results;
    }

    // Lấy domain từ URL
    function getDomain(url) {
      try {
        let u = new URL(url);
        return u.hostname.toLowerCase();
      } catch {
        return "";
      }
    }

    // Xử lý file
    function handleFiles(files) {
      // Dùng Web Worker hoặc setTimeout để tránh đơ UI khi file lớn
      let filesArr = Array.from(files);
      let index = 0;

      function processNext() {
        if (index >= filesArr.length) {
          finalizeData();
          return;
        }
        const file = filesArr[index];
        index++;
        const reader = new FileReader();
        reader.onload = function(e) {
          const text = e.target.result;
          const accounts = parseText(text);
          for (const acc of accounts) {
            const domain = getDomain(acc.url);
            if (!domain) continue;
            // Lọc trùng user+pass trên cùng domain
            if (!domainAccounts.has(domain)) domainAccounts.set(domain, []);
            const list = domainAccounts.get(domain);
            // Kiểm tra trùng
            if (!list.some(x => x.user === acc.user && x.pass === acc.pass)) {
              list.push({ user: acc.user, pass: acc.pass });
            }
          }
          // Tiếp file tiếp theo
          setTimeout(processNext, 10);
        };
        reader.readAsText(file);
      }

      processNext();
    }

    // Hiển thị danh sách domain theo số lượng tài khoản giảm dần
    function showDomainList() {
      const tbody = document.querySelector("#domainTable tbody");
      tbody.innerHTML = "";

      // Lấy mảng domain + count
      let arr = [];
      for (const [domain, accounts] of domainAccounts.entries()) {
        arr.push({ domain, count: accounts.length });
      }

      // Sắp xếp giảm dần theo số tài khoản
      arr.sort((a,b) => b.count - a.count);

      filteredDomains = arr;

      for (const {domain, count} of arr) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${domain}</td><td class="domain-count">${count} tài khoản</td>`;
        tr.onclick = () => showAccounts(domain);
        tbody.appendChild(tr);
      }
    }

    // Lọc domain theo từ khóa
    function filterDomains() {
      const keyword = document.getElementById("domainSearchInput").value.toLowerCase();
      const tbody = document.querySelector("#domainTable tbody");
      tbody.innerHTML = "";

      filteredDomains
        .filter(d => d.domain.includes(keyword))
        .forEach(({domain, count}) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${domain}</td><td class="domain-count">${count} tài khoản</td>`;
          tr.onclick = () => showAccounts(domain);
          tbody.appendChild(tr);
        });
    }

    // Hiển thị danh sách tài khoản của domain (bảng) và nút copy
    function showAccounts(domain) {
      const accounts = domainAccounts.get(domain);
      if (!accounts || accounts.length === 0) return;

      document.getElementById("selectedDomain").textContent = domain;
      const tbody = document.querySelector("#accountTable tbody");
      tbody.innerHTML = "";

      accounts.forEach(({user, pass}, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${user}</td>
          <td>${pass}</td>
          <td>
            <button class="btn-copy" onclick="copyToClipboard('${user}', '${pass}', this)">Copy</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("accountListBox").style.display = "block";
      // Cuộn lên trên để thấy rõ
      document.getElementById("accountListBox").scrollIntoView({ behavior: 'smooth' });
    }

    // Copy user và pass dạng "user | pass"
    function copyToClipboard(user, pass, btn) {
      const text = `${user} | ${pass}`;
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = old, 1500);
      });
    }

    // Lưu toàn bộ tài khoản thành file txt
    function saveAllToFile() {
      let lines = [];
      for (const [domain, accounts] of domainAccounts.entries()) {
        accounts.forEach(({user, pass}) => {
          lines.push(`${domain} | ${user} | ${pass}`);
        });
      }
      const blob = new Blob([lines.join('\n')], {type: 'text/plain'});
      const url = URL.createObjectURL(blob);
      const dl = document.getElementById("downloadLink");
      dl.href = url;
      dl.style.display = "inline-block";
    }

    document.getElementById("fileInput").addEventListener("change", function(e){
      // Ẩn bảng tài khoản khi load mới
      document.getElementById("accountListBox").style.display = "none";
      domainAccounts.clear();
      document.getElementById("downloadLink").style.display = "none";

      handleFiles(e.target.files);
    });

    // Khi xử lý xong, show domain và bật nút lưu
    function finalizeData() {
      showDomainList();
      saveAllToFile();
    }
  </script>
</body>
</html>
