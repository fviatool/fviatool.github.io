
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lọc Trùng & Ký Tự</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f2f5; padding: 20px; }
    .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    h3 { color: #1877f2; }
    textarea { width: 100%; margin-bottom: 10px; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ddd; resize: vertical; }
    button { margin-bottom: 10px; }
    pre { background: #f8f9fa; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
<div class="container">
  <h3 class="text-center">LỌC TRÙNG DỮ LIỆU TEXT</h3>

  <textarea id="rawData" rows="5" placeholder="Nhập hoặc tải dữ liệu..." oninput="processData()"></textarea>
  <div class="mb-2">
    <button onclick="loadFile()" class="btn btn-primary">📂 Chọn file</button>
    <button onclick="clearData()" class="btn btn-danger">🗑 Xóa dữ liệu</button>
  </div>
  <button class="btn btn-secondary btn-sm mb-3" onclick="copyText('uniqueData')">📋 Copy dữ liệu không trùng</button>
  <label><strong>Dữ liệu đã lọc trùng:</strong></label>
  <textarea id="uniqueData" rows="4" readonly></textarea>

  <label><strong>Dữ liệu trùng lặp:</strong></label>
  <textarea id="duplicateData" rows="4" readonly></textarea>
  <button class="btn btn-secondary btn-sm mb-3" onclick="copyText('duplicateData')">📋 Copy dữ liệu trùng</button>
  <p id="totalData">Tổng dữ liệu: 0</p>
  <progress id="progressBar" value="0" max="100" class="progress w-100 mb-4"></progress>

  <h3 class="text-center">LỌC KÝ TỰ CHỨA / KHÔNG CHỨA</h3>
  <textarea id="filterText" rows="2" placeholder="Từ khóa lọc (mỗi dòng 1 từ)"></textarea>
  <div class="mb-2">
    <button class="btn btn-info" onclick="filterContains()">Lọc chứa</button>
    <button class="btn btn-warning" onclick="filterNotContains()">Lọc không chứa</button>
  </div>

  <label><strong>Kết quả lọc:</strong></label>
  <pre id="result" style="height: 200px; overflow-y: auto;"></pre>
  <p id="message" class="text-success"></p>
  <button class="btn btn-secondary btn-sm mb-3" onclick="copyText('result')">📋 Copy kết quả lọc ký tự</button>
</div>

<script>
  let worker;

  function processData() {
    const data = document.getElementById("rawData").value;
    if (!data.trim()) return;

    document.getElementById("progressBar").value = 0;
    document.getElementById("totalData").textContent = "Tổng dữ liệu: 0";
    document.getElementById("uniqueData").value = "";
    document.getElementById("duplicateData").value = "";

    if (worker) worker.terminate();
    worker = new Worker(URL.createObjectURL(new Blob([`
      self.onmessage = function (e) {
        const lines = e.data.split('\\n').map(l => l.trim()).filter(l => l);
        const uniqueSet = new Set();
        const unique = [], duplicate = [];
        for (const line of lines) {
          if (uniqueSet.has(line)) {
            duplicate.push(line);
          } else {
            uniqueSet.add(line);
            unique.push(line);
          }
        }
        postMessage({ uniqueLines: unique, duplicates: duplicate, totalLines: lines.length });
      };
    `], { type: 'application/javascript' })));

    worker.postMessage(data);
    worker.onmessage = function ({ data }) {
      document.getElementById("uniqueData").value = data.uniqueLines.join('\n');
      document.getElementById("duplicateData").value = data.duplicates.join('\n');
      document.getElementById("totalData").textContent = `Tổng dữ liệu: ${data.totalLines}`;
      document.getElementById("progressBar").value = 100;
    };
  }

  function loadFile() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".txt";
    input.onchange = function (e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function (ev) {
        document.getElementById("rawData").value = ev.target.result;
        processData();
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function clearData() {
    ['rawData', 'uniqueData', 'duplicateData'].forEach(id => document.getElementById(id).value = "");
    document.getElementById("result").textContent = "";
    document.getElementById("message").textContent = "";
    document.getElementById("totalData").textContent = "Tổng dữ liệu: 0";
    document.getElementById("progressBar").value = 0;
    if (worker) worker.terminate();
  }

  function filterContains() {
    filterLines(true);
  }

  function filterNotContains() {
    filterLines(false);
  }

  function filterLines(contains) {
    const input = document.getElementById('uniqueData').value || document.getElementById('rawData').value;
    const filters = document.getElementById('filterText').value.split('\n').map(t => t.trim().toLowerCase()).filter(Boolean);
    if (!filters.length) return;

    const lines = input.split('\n').map(l => l.trim());
    const result = lines.filter(line => {
      const lower = line.toLowerCase();
      return contains ? filters.some(f => lower.includes(f)) : filters.every(f => !lower.includes(f));
    });

    document.getElementById('result').textContent = result.join('\n');
    document.getElementById('message').textContent = `Số dòng sau khi lọc: ${result.length}`;
  }
  
  function copyText(id) {
  const el = document.getElementById(id);
  if (!el.value && !el.textContent) return alert("Không có nội dung để sao chép!");
  const text = el.value || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert("✅ Đã sao chép nội dung!");
  }).catch(() => {
    alert("❌ Không thể sao chép!");
  });
}
</script>
</body>
</html>
