
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Lọc Trùng</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" crossorigin="anonymous">
    <script src="//code.jquery.com/jquery.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { text-align: center; color: #1877f2; }
        textarea, input, button { width: 100%; margin-bottom: 10px; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #1877f2; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #0d6efd; }
        .result-box { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; }
        .live { background-color: #d4edda; color: #155724; }
        .dead { background-color: #f8d7da; color: #721c24; }
    </style>

</head>

<body>
    <div class="text-container">
            <div class="panel panel-primary">
                <div class="panel-heading">
                    <h3 class="panel-title">LỌC TRÙNG DỮ LIỆU TEXT</h3>
                </div>
                <div class="panel-body">
                    <div class="form-group">
                        <textarea id="rawData" rows="5" oninput="processData()" class="form-control"></textarea>
                        <br>
                        <button onclick="loadFile()" class="btn btn-primary">Chọn file</button>
                        <button onclick="clearData()" class="btn btn-danger">Xóa dữ liệu</button>
                        <br>
                        <textarea id="uniqueData" rows="3" class="form-control" placeholder="Dữ Liệu Đã Lọc Trùng..."></textarea>
                        <br>
                        <textarea id="duplicateData" rows="3" class="form-control" placeholder="Dữ Liệu Trùng Lặp..."></textarea>
                        <p id="totalData">Tổng dữ liệu: 0</p>
                        <progress id="progressBar" value="0" max="100" class="progress"></progress>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel panel-primary">
            <div class="panel-heading">
                <h3 class="panel-title">Lọc Ký Tự Chứa/Không Chứa</h3>
            </div>
            <div class="panel-body">
                <textarea id="inputText" rows="3" class="form-control" placeholder="Nhập dữ liệu để lọc..."></textarea>
                <textarea id="filterText" rows="3" class="form-control" placeholder="Từ khóa lọc..."></textarea>
                <br>
                <button onclick="filterContains()" class="btn btn-info">Lọc chứa</button>
                <button onclick="filterNotContains()" class="btn btn-warning">Lọc không chứa</button>
                <br><br>
                <pre id="result" class="form-control" style="height: 200px; overflow-y: scroll;"></pre>
                <p id="message" class="text-success"></p>
            </div>
        </div>
    </div>

    <script>
        let worker;

        function processData() {
            document.getElementById("totalData").textContent = "Tổng dữ liệu: 0";
            clearResults();
            document.getElementById("progressBar").value = 0;
            const data = document.getElementById("rawData").value;
            if (worker) worker.terminate();
            worker = new Worker(URL.createObjectURL(new Blob([`
                self.onmessage = function (e) {
                    const data = e.data.split('\n');
                    const unique = [...new Set(data.filter(line => line.trim() !== ''))];
                    const duplicates = data.filter((item, index) => data.indexOf(item) !== index);
                    postMessage({ uniqueLines: unique, duplicates, totalLines: data.length });
                };
            `], { type: "application/javascript" })));
            worker.postMessage(data);
            worker.onmessage = function (event) {
                const { uniqueLines, duplicates, totalLines } = event.data;
                document.getElementById("totalData").textContent = `Tổng dữ liệu: ${totalLines}`;
                updateDisplay(uniqueLines, duplicates);
                document.getElementById("progressBar").value = 100;
            };
        }

        function updateDisplay(uniqueLines, duplicates) {
            document.getElementById("uniqueData").textContent = uniqueLines.join("\n");
            document.getElementById("duplicateData").textContent = duplicates.join("\n");
        }

        function clearResults() {
            document.getElementById("uniqueData").textContent = "";
            document.getElementById("duplicateData").textContent = "";
        }

        function clearData() {
            document.getElementById("rawData").value = "";
            clearResults();
            document.getElementById("totalData").textContent = "Tổng dữ liệu: 0";
        }

        function loadFile() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".txt";
            input.onchange = function (event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById("rawData").value = e.target.result;
                    processData();
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function filterContains() {
            const inputText = document.getElementById('inputText').value;
            const filterText = document.getElementById('filterText').value;
            const result = document.getElementById('result');

            const worker = new Worker(URL.createObjectURL(new Blob([`
                self.onmessage = function (e) {
                    const { inputText, filterText, contains } = e.data;
                    const inputLines = inputText.split('\n');
                    const filterLines = filterText.split('\n');
                    const resultLines = inputLines.filter(line => {
                        return contains ? filterLines.some(f => line.toLowerCase().includes(f.toLowerCase()))
                                          : !filterLines.some(f => line.toLowerCase().includes(f.toLowerCase()));
                    });
                    postMessage(resultLines.join('\n'));
                };
            `], { type: "application/javascript" })));

            worker.onmessage = function (e) {
                const resultText = e.data;
                result.textContent = resultText;
                showMessage(`Số dòng sau khi lọc: ${resultText.split('\n').length}`);
            };

            worker.postMessage({ inputText, filterText, contains: true });
        }

        function filterNotContains() {
            const inputText = document.getElementById('inputText').value;
            const filterText = document.getElementById('filterText').value;
            const result = document.getElementById('result');

            const worker = new Worker(URL.createObjectURL(new Blob([`
                self.onmessage = function (e) {
                    const { inputText, filterText, contains } = e.data;
                    const inputLines = inputText.split('\n');
                    const filterLines = filterText.split('\n');
                    const resultLines = inputLines.filter(line => {
                        return contains ? filterLines.some(f => line.toLowerCase().includes(f.toLowerCase()))
                                          : !filterLines.some(f => line.toLowerCase().includes(f.toLowerCase()));
                    });
                    postMessage(resultLines.join('\n'));
                };
            `], { type: "application/javascript" })));

            worker.onmessage = function (e) {
                const resultText = e.data;
                result.textContent = resultText;
                showMessage(`Số dòng sau khi lọc: ${resultText.split('\n').length}`);
            };

            worker.postMessage({ inputText, filterText, contains: false });
        }

        function showMessage(message) {
            document.getElementById('message').textContent = message;
        }
    </script>
</body>

</html>
