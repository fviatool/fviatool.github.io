<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🚀 Check UID Facebook</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;padding:15px;}
textarea{width:100%;height:100px;margin-bottom:8px;resize:none;font-family:monospace;}
button{padding:6px 12px;background:#007bff;color:#fff;border:none;cursor:pointer;margin-right:5px;font-size:14px;}
button:hover{background:#0056b3;}
.table-wrapper{max-height:400px;overflow-y:auto;margin-top:10px;background:#fff;border:1px solid #ddd;border-radius:4px;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:5px;text-align:center;white-space:nowrap;font-size:13px;}
th{background:#007bff;color:#fff;position:sticky;top:0;z-index:10;}
tr:nth-child(even){background:#f2f2f2;}
.live{background:#c8e6c9;}
</style>
</head>
<body>

<h3>🚀 Check UID Facebook</h3>

<label>Chọn nhiều file UID (.txt lớn):</label>
<input type="file" id="fileInput" accept=".txt" multiple style="margin-bottom:8px;" /><br>

<label>Hoặc nhập UID (mỗi dòng 1 UID):</label>
<textarea id="uids" placeholder="1000xxxxxxxxxx"></textarea><br>

<label>Nhập token (mỗi dòng 1 token):</label>
<textarea id="tokens" placeholder="EAAG..."></textarea><br>

<button id="checkTokenBtn">✅ Check Token Live</button>
<button id="copyTokenBtn">📋 Copy Token Live</button>
<button onclick="startCheckFast()">🚀 Bắt đầu Check UID</button>
<button id="copyBtn">📋 Copy kết quả</button>

<p>✅ Token Live: <span id="liveCount">0</span></p>
<p>✅ Tổng UID check: <span id="checkedCount">0</span></p>
<p id="fileMessage" style="color:green;"></p> <!-- Thông báo số UID đã lọc trùng -->

<div class="table-wrapper">
<table id="result">
<thead>
<tr><th>UID</th><th>Tên</th><th>Vị trí</th><th>Công việc</th><th>Học vấn</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
let liveTokens=[];

// Lọc trùng UID
function removeDuplicateUIDs(){
    const textarea=document.getElementById('uids');
    const lines=textarea.value.trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const uniqueLines=Array.from(new Set(lines));
    textarea.value=uniqueLines.join("\n");
    return uniqueLines;
}

// Check token live
async function checkTokensLive(){
    const lines=document.getElementById("tokens").value.trim().split("\n").map(t=>t.trim()).filter(Boolean);
    liveTokens=[];
    await Promise.all(lines.map(async t=>{
        try{
            const res=await fetch(`https://graph.facebook.com/me?access_token=${t}`);
            const json=await res.json();
            if(json.id) liveTokens.push(t);
        }catch{}
    }));
    document.getElementById("tokens").value=liveTokens.join("\n");
    document.getElementById("liveCount").innerText=liveTokens.length;
    alert(`✅ ${liveTokens.length} token live`);
}
document.getElementById("checkTokenBtn").addEventListener("click",checkTokensLive);
document.getElementById("copyTokenBtn").addEventListener("click",()=>{
    if(liveTokens.length===0) return alert("Không có token live");
    navigator.clipboard.writeText(liveTokens.join("\n")).then(()=>alert("✅ Đã copy token live"));
});

// Lấy info user
async function fetchUserInfo(uid, token){
    const fields="name,location,email,work,education";
    const url=`https://graph.facebook.com/${uid}?fields=${fields}&access_token=${token}`;
    const res=await fetch(url);
    return res.json();
}

function updateCheckedCount(){
    const tbody=document.querySelector("#result tbody");
    document.getElementById("checkedCount").innerText=tbody.querySelectorAll("tr").length;
}

async function handleUID(uid,token,tbody){
    try{
        const data=await fetchUserInfo(uid,token);
        if(data.error) return; // Không hiển thị UID lỗi
        const pos=data.location?.name||"Không rõ";
        const workInfo=data.work?.map(w=>w.employer?.name).join(", ")||"Không có";
        const eduInfo=data.education?.map(e=>e.school?.name).join(", ")||"Không có";
        const tr=document.createElement("tr");
        tr.innerHTML=`<td>${uid}</td><td>${data.name||"Không rõ"}</td><td>${pos}</td><td>${workInfo}</td><td>${eduInfo}</td>`;
        tr.className="live";
        tbody.appendChild(tr);
    }catch{}
    updateCheckedCount();
}

// Check nhanh nhiều token
async function startCheckFast(){
    const uidList=removeDuplicateUIDs();
    if(uidList.length===0) return alert("Vui lòng nhập UID");
    if(liveTokens.length===0) return alert("Không có token live");
    const tbody=document.querySelector("#result tbody");
    tbody.innerHTML="";
    const batchSize=50;
    let index=0;
    while(index<uidList.length){
        const batches=liveTokens.map((token,i)=>{
            const uids=uidList.slice(index+i*batchSize,index+(i+1)*batchSize);
            return {token,uids};
        });
        await Promise.all(batches.map(async ({token,uids})=>{
            await Promise.all(uids.map(uid=>handleUID(uid,token,tbody)));
        }));
        index+=batchSize*liveTokens.length;
        await new Promise(r=>setTimeout(r,200));
    }
}

// Copy kết quả
document.getElementById("copyBtn").addEventListener("click",()=>{
    const tbody=document.querySelector("#result tbody");
    if(!tbody.hasChildNodes()) return alert("Không có dữ liệu");
    const rows=Array.from(tbody.querySelectorAll("tr"));
    let text="UID|Tên|Vị trí|Công việc|Học vấn\n";
    rows.forEach(row=>{
        const cells=Array.from(row.querySelectorAll("td")).map(td=>td.innerText.trim());
        text+=cells.join("|")+"\n";
    });
    navigator.clipboard.writeText(text).then(()=>alert("✅ Đã copy kết quả"));
});

// Mở nhiều file lớn và lọc trùng, hiển thị thông báo
document.getElementById('fileInput').addEventListener('change', function(e){
    const files = e.target.files;
    if(!files.length) return;
    let allUIDs = [];
    let filesRead = 0;

    Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt){
            const lines = evt.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            allUIDs = allUIDs.concat(lines);
            filesRead++;
            if(filesRead === files.length){
                const uniqueUIDs = Array.from(new Set(allUIDs));
                document.getElementById('uids').value = uniqueUIDs.join("\n");
                document.getElementById('fileMessage').innerText = `✅ Đã lọc trùng: ${uniqueUIDs.length} UID từ ${files.length} file`;
            }
        };
        reader.readAsText(file);
    });
});
</script>
</body>
</html>
